name: Test

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: ubuntu-latest
    container: ghcr.io/realm/swiftlint:latest
    steps:
      - uses: actions/checkout@v4
      - name: Run SwiftLint
        run: swiftlint

  unit-tests:
    name: Unit tests (Swift ${{ matrix.swift }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - xcode: Xcode_16.2
            swift: "6.0"
          - xcode: Xcode_26.3
            swift: "6.2"
    env:
      DEVELOPER_DIR: /Applications/${{ matrix.xcode }}.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: swift test -Xswiftc -warnings-as-errors --explicit-target-dependency-import-check error

  platform-build:
    name: Build (${{ matrix.product }}, ${{ matrix.platform }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        product: [RagnarNetworking, RagnarWebSocket, RagnarSocketIO]
        platform: [iOS, tvOS, watchOS, visionOS]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          xcodebuild -scheme "${{ matrix.product }}" \
            -destination "generic/platform=${{ matrix.platform }}" \
            build

  socket-io-integration:
    name: Socket.IO 4.7.4 integration
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: IntegrationTests/SocketIOReferenceServer/package-lock.json
      - name: Run Socket.IO integration tests
        run: Scripts/run-socketio-integration-tests.sh
